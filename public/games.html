<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>המשחקים שלי - קעמפ-קליק</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="./css/game.css">
</head>
<body>

  <div class="topbar">
    <div class="brand">קעמפ-קליק</div>
    <div class="who">
      <a class="home-btn" href="/">דף הבית</a>
      <span id="whoami"></span>
      <button class="btn" id="logoutBtn">התנתקות</button>
    </div>
  </div>

  <main>
    <h1 id="pageTitle">המשחקים שלי</h1>
    <p class="sub" id="pageSub">צרו משחק חדש, ערכו שאלות, והפעילו אותו כשמוכנים.</p>

    <form class="create-row" id="createForm">
      <input type="text" id="newGameName" placeholder="שם משחק חדש (לדוגמה: פורים 2026)" required>
      <button type="submit" class="btn gold">צור משחק</button>
    </form>

    <div id="gamesList"></div>

    <div id="adminSection" hidden>
      <h2 class="section-title">כל המשתמשים בפלטפורמה</h2>
      <table class="users-table">
        <thead><tr><th>אימייל</th><th>מספר משחקים</th><th>נרשם בתאריך</th></tr></thead>
        <tbody id="usersTbody"></tbody>
      </table>
    </div>
  </main>

  <div id="paymentOverlay" class="modal-overlay" hidden>
    <div class="modal-box">
      <button class="modal-close" id="paymentCloseBtn" type="button">✕</button>
      <h2>רכישת גישה מלאה</h2>
      <div class="modal-sub" id="paymentModalSub"></div>
      <div class="payment-status" id="paymentStatus"></div>

      <div id="paymentDetailsForm">
        <label class="field-label">שם פרטי
          <input type="text" id="payerFirstName" class="field-input" autocomplete="given-name">
        </label>
        <label class="field-label">שם משפחה
          <input type="text" id="payerLastName" class="field-input" autocomplete="family-name">
        </label>
        <label class="field-label">תעודת זהות
          <input type="text" id="payerZeout" class="field-input" inputmode="numeric" maxlength="9" autocomplete="off">
        </label>
        <label class="field-label">טלפון
          <input type="tel" id="payerPhone" class="field-input" inputmode="numeric" autocomplete="tel">
        </label>
        <label class="policy-consent">
          <input type="checkbox" id="policyAgreeCheckbox">
          <span>קראתי ואני מאשר/ת את <a href="/terms.html" target="_blank" rel="noopener">תנאי השימוש</a> ואת <a href="/privacy.html" target="_blank" rel="noopener">מדיניות הפרטיות</a></span>
        </label>
        <button class="btn gold" id="paymentDetailsSubmitBtn" type="button" disabled>המשך לתשלום</button>
      </div>

      <div id="paymentCardSection" hidden>
        <div class="nedarim-frame-wrap">
          <iframe id="NedarimFrame" scrolling="no" style="height:420px"></iframe>
        </div>
        <button class="btn gold" id="paymentPayBtn" type="button" disabled>בצע תשלום</button>
      </div>
    </div>
  </div>

<script>
let myRole = null;

async function init() {
  const me = await (await fetch('/admin/me')).json();
  if (!me.authenticated) { location.href = '/'; return; }
  myRole = me.role;

  document.getElementById('whoami').textContent = me.role === 'admin' ? 'מנהל מערכת' : me.email;
  if (me.role === 'admin') {
    document.getElementById('pageTitle').textContent = 'כל המשחקים בפלטפורמה';
    document.getElementById('pageSub').textContent = 'כמנהל מערכת אתה רואה ויכול לנהל את כל המשחקים של כל המשתמשים.';
    document.getElementById('createForm').hidden = true;
    document.getElementById('adminSection').hidden = false;
    loadUsers();
  }
  loadGames();
}

let gamesById = {}; // שלב 5: מאפשר לשלוף שם משחק/פרטים בעת פתיחת מודאל תשלום, בלי לשלוף שוב מהשרת

// מציג תאריך+שעה בעברית - רק שעה אם זה היום, אחרת גם תאריך קצר
function formatDeadline(paidUntil) {
  if (!paidUntil) return '';
  const d = new Date(paidUntil);
  const time = d.toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' });
  const sameDay = d.toDateString() === new Date().toDateString();
  if (sameDay) return `היום בשעה ${time}`;
  const dateStr = d.toLocaleDateString('he-IL', { day: '2-digit', month: '2-digit' });
  return `${dateStr} בשעה ${time}`;
}

async function loadGames() {
  const res = await fetch('/games');
  const games = await res.json();
  const list = document.getElementById('gamesList');
  gamesById = Object.fromEntries(games.map((g) => [g._id, g]));

  if (!games.length) {
    list.innerHTML = '<div class="empty">עדיין אין משחקים. צרו את הראשון למעלה.</div>';
    return;
  }

  list.innerHTML = games.map((g) => `
    <div class="game-card${(myRole === 'user' && g.hasExtendedAccess) ? ' paid-active' : ''}" data-id="${g._id}">
      <div class="game-name">
        <span class="view-name">${g.name}</span>
        ${myRole === 'admin' ? `<div class="owner-tag">בעלים: ${g.ownerEmail || '—'}</div>` : ''}
      </div>
      <div class="game-code-badge" title="קוד המשחק - זה מה שהמתקשרים מקישים כדי להצטרף">
        קוד הצטרפות: <strong>${g.code || '—'}</strong>
      </div>
      <span class="status-pill ${g.isActive ? 'live' : 'off'}">${g.isActive ? 'חי כרגע' : 'לא פעיל'}</span>
      ${g.isActive ? `<button class="btn gold" onclick="location.href='/admin.html?gameId=${g._id}'">פתח מסך חי</button>` : ''}
      ${g.isActive && g.hasExtendedAccess ? `<span class="deadline-note">פתוח עד ${formatDeadline(g.paidUntil)}</span>` : ''}
      ${renderActivateArea(g)}
      <button class="btn" data-act="deactivate" ${g.isActive ? '' : 'disabled'}>הפסק</button>
      <button class="btn" data-act="rename">שנה שם</button>
      <button class="btn danger" data-act="delete" ${g.isActive ? 'disabled' : ''}>מחק</button>
    </div>
  `).join('');

  list.querySelectorAll('.game-card').forEach((card) => {
    const id = card.dataset.id;
    const trialBtn = card.querySelector('[data-act="activate-trial"]');
    const fullBtn = card.querySelector('[data-act="activate-full"]');
    const payBtn = card.querySelector('[data-act="activate-paid"]');
    const upgradeBtn = card.querySelector('[data-act="upgrade-paid"]');
    const adminBtn = card.querySelector('[data-act="activate"]');
    if (trialBtn) trialBtn.addEventListener('click', () => activate(id));
    if (fullBtn) fullBtn.addEventListener('click', () => activate(id)); // כבר שילם - מפעיל ישירות, בלי תשלום נוסף
    if (payBtn) payBtn.addEventListener('click', () => openPaymentModal(id, false));
    if (upgradeBtn) upgradeBtn.addEventListener('click', () => openPaymentModal(id, true)); // שדרוג תוך כדי סשן חי - לא נוגע בשחקנים/תשובות
    if (adminBtn) adminBtn.addEventListener('click', () => activate(id));
    card.querySelector('[data-act="deactivate"]').addEventListener('click', () => deactivate(id));
    card.querySelector('[data-act="rename"]').addEventListener('click', () => rename(id, card));
    card.querySelector('[data-act="delete"]').addEventListener('click', () => del(id));
  });
}

// שלב 5: כפתור ה"הפעל" מתפצל לפי מצב התשלום של המשחק הספציפי הזה (התשלום
// הוא per-game, לא per-account). לא רלוונטי למנהל-על, שרואה תמיד כפתור הפעלה
// רגיל - וההפעלה שלו ממילא תמיד פותחת גישה מלאה בלי תשלום (ראו gamesRoutes.js).
// חשוב: אפשרות השדרוג לגישה מלאה קיימת גם כשהמשחק כבר חי על ניסיון חינם - לא
// רק לפני ההפעלה - כדי שלא "ייעלם" ברגע שהמנחה כבר התחיל עם הניסיון החינמי.
function renderActivateArea(g) {
  if (myRole !== 'user') {
    return `<button class="btn" data-act="activate" ${g.isActive ? 'disabled' : ''}>הפעל</button>`;
  }
  if (g.isActive) {
    if (g.hasExtendedAccess) {
      return `<button class="btn" data-act="activate" disabled>הפעל</button>`;
    }
    // חי כרגע במסלול ניסיון חינם - עדיין אפשר לשדרג לגישה מלאה בלי לאבד את הסשן הרץ
    return `
      <button class="btn" data-act="activate" disabled>הפעל</button>
      <button class="btn gold" data-act="upgrade-paid">שדרג לגישה מלאה · ₪15 בלבד · 50 שעות</button>
    `;
  }
  if (g.hasExtendedAccess) {
    return `
      <button class="btn gold" data-act="activate-full">הפעל</button>
      <span class="deadline-note">פתוח עד ${formatDeadline(g.paidUntil)}</span>
    `;
  }
  // שתי האופציות מקובצות ויזואלית יחד (מסגרת אחת + "או" ביניהן), כדי שיהיה
  // ברור שמדובר בבחירה בין שתי חלופות לאותה פעולה, לא שני כפתורים נפרדים.
  return `
    <div class="activate-choice">
      <button class="btn" data-act="activate-trial">התחל ניסיון חינם (עד 3 משתתפים)</button>
      <span class="choice-or">או</span>
      <button class="btn gold" data-act="activate-paid">הפעל גישה מלאה · ₪15 בלבד · 50 שעות</button>
    </div>
  `;
}

async function doActivate(id) {
  const res = await fetch(`/games/${id}/activate`, { method: 'POST' });
  const data = await res.json();
  if (!res.ok) { alert(data.error || 'שגיאה בהפעלת המשחק'); return false; }
  return true;
}

// שלב 5: אותה אזהרת "פתיחת סשן חדש" חייבת לחול גם על הפעלה מלאה (בתשלום),
// לא רק על ניסיון חינם - זו אותה פעולת activate() בשרת בדיוק, עם אותן השלכות
// (מחיקת שחקנים/תשובות מסשן קודם). מיוצא כפונקציה נפרדת כדי שגם openPaymentModal
// יוכל להשתמש בה לפני שמתחילים בתשלום.
async function confirmSessionWipe(id) {
  let msg = 'הפעלת המשחק תתחיל סשן חדש: כל הניקוד והסטטיסטיקות מסשנים קודמים של משחק זה יימחקו. להמשיך?';
  try {
    const previewRes = await fetch(`/games/${id}/activate-preview`);
    if (previewRes.ok) {
      const { playerCount, answerCount } = await previewRes.json();
      if (playerCount > 0 || answerCount > 0) {
        msg = `קיימים כבר ${playerCount} שחקנים ו-${answerCount} תשובות למשחק הזה (כנראה מסשן קודם). ` +
          `הפעלה תמחק את כל הנתונים האלה לצמיתות. להפעיל בכל זאת?`;
      }
    }
  } catch { /* אם הבדיקה נכשלת, ממשיכים עם האזהרה הגנרית - לא חוסמים את הפעולה בגלל זה */ }
  return confirm(msg);
}

async function activate(id) {
  if (!(await confirmSessionWipe(id))) return;
  if (await doActivate(id)) loadGames();
}
async function deactivate(id) {
  await fetch(`/games/${id}/deactivate`, { method: 'POST' });
  loadGames();
}
function rename(id, card) {
  const span = card.querySelector('.view-name');
  const current = span.textContent;
  span.outerHTML = `<input type="text" class="rename-input" value="${current}">`;
  const input = card.querySelector('.rename-input');
  input.focus();
  input.addEventListener('keydown', async (e) => {
    if (e.key !== 'Enter') return;
    await fetch(`/games/${id}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: input.value.trim() })
    });
    loadGames();
  });
}
async function del(id) {
  if (!confirm('למחוק את המשחק לצמיתות? כל השאלות, השחקנים והתשובות יימחקו ולא ניתן לשחזר.')) return;
  const res = await fetch(`/games/${id}`, { method: 'DELETE' });
  const data = await res.json();
  if (!res.ok) { alert(data.error || 'שגיאה במחיקה'); return; }
  loadGames();
}

// ===== שלב 5: אינטגרציית נדרים פלוס (זרימת "הקמת עסקה בצד שרת") =====
// לפי תיעוד נדרים פלוס: יש לרשום את מאזין ה-message ולטעון את ה-src של
// האייפרם פעם אחת בלבד בחיי הדף - הפעלה כפולה עלולה לגרום לחיוב כפול.
let nedarimFrame = null;
let pendingPayment = null; // { gameId, paramId, transactionId }

function initNedarimFrameOnce() {
  if (nedarimFrame) return;
  nedarimFrame = document.getElementById('NedarimFrame');
  window.addEventListener('message', handleNedarimMessage);
  nedarimFrame.onload = () => {
    console.log('[נדרים פלוס] האייפרם נטען, שולח GetHeight');
    postNedarim({ Name: 'GetHeight' });
  };
  nedarimFrame.src = 'https://www.matara.pro/nedarimplus/iframe/';
}

function postNedarim(data) {
  console.log('[נדרים פלוס] שולח לאייפרם:', data);
  nedarimFrame.contentWindow.postMessage(data, '*');
}

function handleNedarimMessage(event) {
  const msg = event.data || {};
  if (!msg.Name) return; // הודעות message אחרות שלא קשורות לנדרים - מתעלמים
  console.log('[נדרים פלוס] התקבלה הודעה:', msg);
  if (msg.Name === 'Height') {
    nedarimFrame.style.height = (parseInt(msg.Value, 10) + 15) + 'px';
  } else if (msg.Name === 'TransactionResponse') {
    onNedarimTransactionResponse(msg.Value || {});
  } else if (msg.Name === 'ValidateFields') {
    onValidateFieldsResponse(msg.Value);
  }
}

// שדה תקין לגמרי (Value === 'OK') - ממשיכים לחיוב בפועל.
// שדה לא תקין (Value === {Field, ErrorType}) - מציגים הודעה ברורה במקום לנסות
// לחייב ולקבל סירוב מהבנק על משהו שאפשר היה לתפוס מראש בצד הלקוח.
function onValidateFieldsResponse(value) {
  if (value === 'OK') {
    setPaymentStatus('מעבד תשלום...');
    postNedarim({ Name: 'FinishTransaction', Value: pendingPayment.transactionId });
    return;
  }
  const fieldNames = { Card: 'מספר הכרטיס', Expiration: 'תוקף הכרטיס', CVV: 'קוד האבטחה (CVV)' };
  const errorNames = { Empty: 'לא מולא', Wrong: 'לא תקין' };
  const fieldLabel = fieldNames[value && value.Field] || (value && value.Field) || 'אחד השדות';
  const errorLabel = errorNames[value && value.ErrorType] || '';
  setPaymentStatus(`${fieldLabel} ${errorLabel} - תקנו ולחצו שוב על "בצע תשלום"`);
  document.getElementById('paymentPayBtn').disabled = false;
}

// שימוש ב-innerHTML לבניית כרטיסיית המחיר מחייב לברוח מתווים מיוחדים בשם
// המשחק (שהמשתמש עצמו הזין) - כדי לא לפתוח פרצת XSS שלא הייתה קיימת כשזה
// היה textContent רגיל.
function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
}

async function openPaymentModal(gameId, isCurrentlyActive) {
  // אם המשחק לא חי כרגע - הפעלה שתגיע אחרי התשלום תמחק שחקנים/תשובות מסשן קודם,
  // בדיוק כמו בניסיון חינם. מציגים את אותה אזהרה *לפני* שגובים תשלום, לא אחריו.
  // אם המשחק כבר חי (שדרוג תוך כדי סשן) - אין מחיקה בכלל, לא צריך אזהרה.
  if (!isCurrentlyActive) {
    if (!(await confirmSessionWipe(gameId))) return;
  }

  pendingPayment = { gameId, paramId: null, transactionId: null, isCurrentlyActive };
  const gameName = (gamesById[gameId] && gamesById[gameId].name) || 'זה';
  document.getElementById('paymentModalSub').innerHTML = `
    <div class="price-badge">
      <span class="price-amount">₪15</span>
      <div class="price-lines">
        <strong>50 שעות גישה מלאה למשחק "${escapeHtml(gameName)}"</strong>
        <span>ללא הגבלה על מספר ההפעלות בתוך 50 השעות, ובלי מגבלת 3 המשתתפים</span>
      </div>
    </div>`;
  setPaymentStatus('');
  document.getElementById('payerFirstName').value = '';
  document.getElementById('payerLastName').value = '';
  document.getElementById('payerZeout').value = '';
  document.getElementById('payerPhone').value = '';
  document.getElementById('policyAgreeCheckbox').checked = false; // חובה לאשר מחדש בכל פתיחה של המודאל
  document.getElementById('paymentDetailsSubmitBtn').disabled = true;
  document.getElementById('paymentDetailsForm').hidden = false;
  document.getElementById('paymentCardSection').hidden = true;
  document.getElementById('paymentOverlay').hidden = false;
}

document.getElementById('policyAgreeCheckbox').addEventListener('change', (e) => {
  document.getElementById('paymentDetailsSubmitBtn').disabled = !e.target.checked;
});

// שלב 1: פרטי משלם (שם פרטי + שם משפחה + ת.ז + טלפון) - שדות נפרדים לשם
// פרטי/משפחה, כמו בדוגמה אמיתית שעובדת מול אותו מוסד (1001242) במערכת אחרת.
document.getElementById('paymentDetailsSubmitBtn').addEventListener('click', async () => {
  const gameId = pendingPayment && pendingPayment.gameId;
  if (!gameId) return;
  const firstName = document.getElementById('payerFirstName').value.trim();
  const lastName = document.getElementById('payerLastName').value.trim();
  const zeout = document.getElementById('payerZeout').value.trim();
  const phone = document.getElementById('payerPhone').value.trim();
  if (!firstName || !lastName) {
    setPaymentStatus('נא למלא שם פרטי ושם משפחה');
    return;
  }
  if (!/^\d{5,9}$/.test(zeout)) {
    setPaymentStatus('נא למלא תעודת זהות תקינה (5-9 ספרות)');
    return;
  }
  if (!/^\d{9,10}$/.test(phone)) {
    setPaymentStatus('נא למלא מספר טלפון תקין (ספרות בלבד)');
    return;
  }
  if (!document.getElementById('policyAgreeCheckbox').checked) {
    setPaymentStatus('יש לאשר את תנאי השימוש ומדיניות הפרטיות כדי להמשיך');
    return;
  }

  document.getElementById('paymentDetailsSubmitBtn').disabled = true;
  setPaymentStatus('יוצר עסקה...');

  try {
    const res = await fetch(`/payments/${gameId}/create`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ firstName, lastName, zeout, phone, agreedToTerms: true })
    });
    const data = await res.json();
    if (!res.ok || !data.success) {
      setPaymentStatus(data.error || 'שגיאה ביצירת עסקה, נסו שוב');
      document.getElementById('paymentDetailsSubmitBtn').disabled = false;
      return;
    }
    pendingPayment.paramId = data.paramId;
    pendingPayment.transactionId = data.transactionId;
    document.getElementById('paymentDetailsForm').hidden = true;
    document.getElementById('paymentCardSection').hidden = false;
    initNedarimFrameOnce(); // חובה לקרוא אחרי שהאייפרם גלוי (לא בזמן שההורה שלו hidden)
    setPaymentStatus('מלאו את פרטי הכרטיס למטה ולחצו "בצע תשלום"');
    document.getElementById('paymentPayBtn').disabled = false;
  } catch {
    setPaymentStatus('שגיאת תקשורת - נסו שוב');
  } finally {
    document.getElementById('paymentDetailsSubmitBtn').disabled = false;
  }
});

function setPaymentStatus(text) {
  document.getElementById('paymentStatus').textContent = text;
}

function closePaymentModal() {
  document.getElementById('paymentOverlay').hidden = true;
  pendingPayment = null;
}

document.getElementById('paymentPayBtn').addEventListener('click', () => {
  console.log('[נדרים פלוס] נלחץ "בצע תשלום", pendingPayment:', pendingPayment);
  if (!pendingPayment || !pendingPayment.transactionId) {
    setPaymentStatus('העסקה עדיין לא מוכנה - נסו שוב בעוד רגע');
    return;
  }
  document.getElementById('paymentPayBtn').disabled = true; // מניעת לחיצה כפולה - לפי המלצת נדרים פלוס
  setPaymentStatus('בודק את פרטי הכרטיס...');
  postNedarim({ Name: 'ValidateFields' }); // רק אם תקין (ראו onValidateFieldsResponse) עוברים בפועל ל-FinishTransaction
});

document.getElementById('paymentCloseBtn').addEventListener('click', closePaymentModal);

// חשוב: Status: OK כאן מגיע מהדפדפן של הגולש ואינו אישור סופי (ניתן לזיוף).
// האישור האמיתי היחיד הוא ה-callback השרתי (routes/paymentRoutes.js). לכן
// מחכים כאן לאישור מהשרת שלנו (polling על /payments/status) ורק אז ממשיכים.
async function onNedarimTransactionResponse(value) {
  if (!pendingPayment) return;
  if (value.Status !== 'OK') {
    setPaymentStatus(value.Message || 'התשלום נכשל, נסו שוב');
    document.getElementById('paymentPayBtn').disabled = false;
    return;
  }
  setPaymentStatus('התשלום התקבל, מאמת מול השרת...');
  const { gameId, paramId, isCurrentlyActive } = pendingPayment;
  const approved = await waitForPaymentApproval(paramId);
  if (!approved) {
    setPaymentStatus('האישור הסופי מתעכב - נסו לרענן בעוד רגע, או פנו לתמיכה אם זה נמשך.');
    return;
  }
  if (isCurrentlyActive) {
    // המשחק כבר חי - לא נוגעים בו (לא מפעילים מחדש, לא מוחקים שחקנים/תשובות).
    // הגישה המלאה כבר פעילה מהרגע שהשרת אישר את התשלום (nedarim-callback).
    setPaymentStatus('מאושר! הגישה המלאה פעילה כעת על המשחק החי.');
  } else {
    setPaymentStatus('מאושר! מפעיל את המשחק...');
    await doActivate(gameId);
  }
  closePaymentModal();
  loadGames();
}

async function waitForPaymentApproval(paramId) {
  for (let i = 0; i < 15; i++) { // עד כ-30 שניות
    await new Promise((r) => setTimeout(r, 2000));
    try {
      const res = await fetch(`/payments/status/${paramId}`);
      const data = await res.json();
      if (data.status === 'approved') return true;
      if (data.status === 'error') return false;
    } catch { /* תקלת רשת זמנית - ננסה שוב בסבב הבא */ }
  }
  return false;
}

async function loadUsers() {
  const res = await fetch('/games/admin/users');
  if (!res.ok) return;
  const users = await res.json();
  document.getElementById('usersTbody').innerHTML = users.map((u) => `
    <tr>
      <td>${u.email}</td>
      <td>${u.gameCount}</td>
      <td>${new Date(u.createdAt).toLocaleDateString('he-IL')}</td>
    </tr>
  `).join('');
}

document.getElementById('createForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const name = document.getElementById('newGameName').value.trim();
  if (!name) return;
  const res = await fetch('/games', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name })
  });
  const data = await res.json();
  if (!res.ok) { alert(data.error || 'שגיאה ביצירת המשחק'); return; }
  document.getElementById('newGameName').value = '';
  loadGames();
});

document.getElementById('logoutBtn').addEventListener('click', async () => {
  await fetch('/admin/logout', { method: 'POST' });
  location.href = '/';
});

init();
</script>
