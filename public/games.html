<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>המשחקים שלי - קעמפ-קליק</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="./css/game.css">
</head>
<body>

  <div class="topbar">
    <div class="brand">קעמפ-קליק</div>
    <div class="who">
      <a class="home-btn" href="/">דף הבית</a>
      <span id="whoami"></span>
      <button class="btn" id="logoutBtn">התנתקות</button>
    </div>
  </div>

  <main>
    <h1 id="pageTitle">המשחקים שלי</h1>
    <p class="sub" id="pageSub">צרו משחק חדש, ערכו שאלות, והפעילו אותו כשמוכנים.</p>

    <!-- שלב 5: גישה מורחבת (תשלום) - רק למשתמש רגיל, לא למנהל-על -->
    <div id="accessBox" class="access-box" hidden></div>

    <div id="paymentSection" hidden>
      <p id="paymentStatus" class="sub"></p>
      <iframe id="NedarimFrame" scrolling="no" style="width:100%;border:none;height:0"></iframe>
    </div>

    <form class="create-row" id="createForm">
      <input type="text" id="newGameName" placeholder="שם משחק חדש (לדוגמה: פורים 2026)" required>
      <button type="submit" class="btn gold">צור משחק</button>
    </form>

    <div id="gamesList"></div>

    <div id="adminSection" hidden>
      <h2 class="section-title">כל המשתמשים בפלטפורמה</h2>
      <table class="users-table">
        <thead><tr><th>אימייל</th><th>מספר משחקים</th><th>נרשם בתאריך</th></tr></thead>
        <tbody id="usersTbody"></tbody>
      </table>
    </div>
  </main>

<script>
let myRole = null;

async function init() {
  const me = await (await fetch('/admin/me')).json();
  if (!me.authenticated) { location.href = '/'; return; }
  myRole = me.role;

  document.getElementById('whoami').textContent = me.role === 'admin' ? 'מנהל מערכת' : me.email;
  if (me.role === 'admin') {
    document.getElementById('pageTitle').textContent = 'כל המשחקים בפלטפורמה';
    document.getElementById('pageSub').textContent = 'כמנהל מערכת אתה רואה ויכול לנהל את כל המשחקים של כל המשתמשים.';
    document.getElementById('createForm').hidden = true;
    document.getElementById('adminSection').hidden = false;
    loadUsers();
  } else {
    document.getElementById('accessBox').hidden = false;
    loadAccessStatus();
  }
  loadGames();
}

async function loadGames() {
  const res = await fetch('/games');
  const games = await res.json();
  const list = document.getElementById('gamesList');

  if (!games.length) {
    list.innerHTML = '<div class="empty">עדיין אין משחקים. צרו את הראשון למעלה.</div>';
    return;
  }

  list.innerHTML = games.map((g) => `
    <div class="game-card" data-id="${g._id}">
      <div class="game-name">
        <span class="view-name">${g.name}</span>
        ${myRole === 'admin' ? `<div class="owner-tag">בעלים: ${g.ownerEmail || '—'}</div>` : ''}
      </div>
      <div class="game-code-badge" title="קוד המשחק - זה מה שהמתקשרים מקישים כדי להצטרף">
        קוד הצטרפות: <strong>${g.code || '—'}</strong>
      </div>
      <span class="status-pill ${g.isActive ? 'live' : 'off'}">${g.isActive ? 'חי כרגע' : 'לא פעיל'}</span>
      ${g.isActive ? `<button class="btn gold" onclick="location.href='/admin.html?gameId=${g._id}'">פתח מסך חי</button>` : ''}
      <button class="btn" data-act="activate" ${g.isActive ? 'disabled' : ''}>הפעל</button>
      <button class="btn" data-act="deactivate" ${g.isActive ? '' : 'disabled'}>הפסק</button>
      <button class="btn" data-act="rename">שנה שם</button>
      <button class="btn danger" data-act="delete" ${g.isActive ? 'disabled' : ''}>מחק</button>
    </div>
  `).join('');

  list.querySelectorAll('.game-card').forEach((card) => {
    const id = card.dataset.id;
    card.querySelector('[data-act="activate"]').addEventListener('click', () => activate(id));
    card.querySelector('[data-act="deactivate"]').addEventListener('click', () => deactivate(id));
    card.querySelector('[data-act="rename"]').addEventListener('click', () => rename(id, card));
    card.querySelector('[data-act="delete"]').addEventListener('click', () => del(id));
  });
}

async function activate(id) {
  let msg = 'הפעלת המשחק תתחיל סשן חדש: כל הניקוד והסטטיסטיקות מסשנים קודמים של משחק זה יימחקו. להמשיך?';
  try {
    const previewRes = await fetch(`/games/${id}/activate-preview`);
    if (previewRes.ok) {
      const { playerCount, answerCount } = await previewRes.json();
      if (playerCount > 0 || answerCount > 0) {
        msg = `קיימים כבר ${playerCount} שחקנים ו-${answerCount} תשובות למשחק הזה (כנראה מסשן קודם). ` +
          `הפעלה תמחק את כל הנתונים האלה לצמיתות. להפעיל בכל זאת?`;
      }
    }
  } catch { /* אם הבדיקה נכשלת, ממשיכים עם האזהרה הגנרית - לא חוסמים את הפעולה בגלל זה */ }
  if (!confirm(msg)) return;
  const res = await fetch(`/games/${id}/activate`, { method: 'POST' });
  const data = await res.json();
  if (!res.ok) { alert(data.error || 'שגיאה בהפעלת המשחק'); return; }
  loadGames();
}
async function deactivate(id) {
  await fetch(`/games/${id}/deactivate`, { method: 'POST' });
  loadGames();
}
function rename(id, card) {
  const span = card.querySelector('.view-name');
  const current = span.textContent;
  span.outerHTML = `<input type="text" class="rename-input" value="${current}">`;
  const input = card.querySelector('.rename-input');
  input.focus();
  input.addEventListener('keydown', async (e) => {
    if (e.key !== 'Enter') return;
    await fetch(`/games/${id}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: input.value.trim() })
    });
    loadGames();
  });
}
async function del(id) {
  if (!confirm('למחוק את המשחק לצמיתות? כל השאלות, השחקנים והתשובות יימחקו ולא ניתן לשחזר.')) return;
  const res = await fetch(`/games/${id}`, { method: 'DELETE' });
  const data = await res.json();
  if (!res.ok) { alert(data.error || 'שגיאה במחיקה'); return; }
  loadGames();
}

async function loadUsers() {
  const res = await fetch('/games/admin/users');
  if (!res.ok) return;
  const users = await res.json();
  document.getElementById('usersTbody').innerHTML = users.map((u) => `
    <tr>
      <td>${u.email}</td>
      <td>${u.gameCount}</td>
      <td>${new Date(u.createdAt).toLocaleDateString('he-IL')}</td>
    </tr>
  `).join('');
}

document.getElementById('createForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const name = document.getElementById('newGameName').value.trim();
  if (!name) return;
  const res = await fetch('/games', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name })
  });
  const data = await res.json();
  if (!res.ok) { alert(data.error || 'שגיאה ביצירת המשחק'); return; }
  document.getElementById('newGameName').value = '';
  loadGames();
});

document.getElementById('logoutBtn').addEventListener('click', async () => {
  await fetch('/admin/logout', { method: 'POST' });
  location.href = '/';
});

// ===================================================================
// שלב 5: גישה מורחבת - תשלום דרך נדרים פלוס (אייפרם, זרימת יצירת עסקה בצד שרת)
// ===================================================================
let currentParamId = null;
let nedarimListenerAttached = false;

async function loadAccessStatus() {
  const res = await fetch('/payments/my-access');
  if (!res.ok) return;
  const data = await res.json();
  const box = document.getElementById('accessBox');
  const now = new Date();
  if (data.paidUntil && new Date(data.paidUntil) > now) {
    const until = new Date(data.paidUntil).toLocaleString('he-IL');
    box.innerHTML = `<span class="access-active">✅ גישה מורחבת פעילה עד ${until} (בלי הגבלת 3 המשתתפים)</span>`;
  } else {
    box.innerHTML = `
      <span>גרסת הניסיון מוגבלת ל-3 משתתפים בו-זמנית למשחק.</span>
      <button class="btn gold" id="buyAccessBtn">רכשו גישה מורחבת - 50 שעות ב-15 ש"ח</button>
    `;
    document.getElementById('buyAccessBtn').addEventListener('click', startPayment);
  }
}

function ensureNedarimListener() {
  if (nedarimListenerAttached) return; // חובה לרשום רק פעם אחת - הפעלה כפולה עלולה לגרום לחיוב כפול
  nedarimListenerAttached = true;
  window.addEventListener('message', (event) => {
    if (!event.data || !event.data.Name) return;
    if (event.data.Name === 'Height') {
      const frame = document.getElementById('NedarimFrame');
      if (frame) frame.style.height = (parseInt(event.data.Value, 10) + 15) + 'px';
    } else if (event.data.Name === 'TransactionResponse') {
      handleNedarimResponse(event.data.Value);
    }
  });
}

function postNedarim(data) {
  document.getElementById('NedarimFrame').contentWindow.postMessage(data, '*');
}

async function startPayment() {
  const btn = document.getElementById('buyAccessBtn');
  if (btn) btn.disabled = true;

  const res = await fetch('/payments/create', { method: 'POST' });
  const data = await res.json();
  if (!res.ok) {
    alert(data.error || 'שגיאה ביצירת עסקה');
    if (btn) btn.disabled = false;
    return;
  }

  currentParamId = data.paramId;
  document.getElementById('paymentSection').hidden = false;
  document.getElementById('paymentStatus').textContent = 'טוען טופס תשלום מאובטח...';

  ensureNedarimListener();
  const frame = document.getElementById('NedarimFrame');
  frame.onload = () => postNedarim({ Name: 'FinishTransaction', Value: data.transactionId });
  frame.src = 'https://www.matara.pro/nedarimplus/iframe/';
}

// חשוב: תגובת האייפרם (TransactionResponse) היא לחוויית משתמש בלבד - האישור
// האמיתי מגיע לשרת שלנו בנפרד (CallBack מאומת). לכן פה רק סוקרים את הסטטוס
// אצלנו במקום לסמוך על ה-Status שמגיע כאן ישירות.
async function handleNedarimResponse(value) {
  if (value.Status === 'Error') {
    document.getElementById('paymentStatus').textContent = 'שגיאה: ' + (value.Message || 'התשלום לא הושלם');
    return;
  }

  document.getElementById('paymentStatus').textContent = 'מאמתים את התשלום מול השרת, נא להמתין...';
  for (let i = 0; i < 10; i++) {
    await new Promise((r) => setTimeout(r, 1500));
    try {
      const statusRes = await fetch(`/payments/status/${currentParamId}`);
      if (!statusRes.ok) continue;
      const statusData = await statusRes.json();
      if (statusData.status === 'approved') {
        document.getElementById('paymentStatus').textContent = '✅ התשלום אושר! הגישה המורחבת פעילה.';
        document.getElementById('paymentSection').hidden = true;
        loadAccessStatus();
        return;
      }
      if (statusData.status === 'error') {
        document.getElementById('paymentStatus').textContent = 'התשלום נכשל.';
        return;
      }
    } catch { /* ממשיכים לנסות */ }
  }
  document.getElementById('paymentStatus').textContent =
    'האישור עדיין לא התקבל מנדרים פלוס - זה יכול לקחת רגע. רעננו את הדף בעוד דקה כדי לבדוק שוב.';
}

init();
</script>
</body>
</html>
